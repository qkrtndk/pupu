<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 궁합은? 💌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
        }
        .heart-pulse { 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#FFF5F6] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] text-center">
        <!-- 헤더 영역 -->
        <div class="mb-8 mt-4">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight mb-2">이름 궁합 테스트</h1>
            <p class="text-sm text-gray-400">우리 둘은 얼마나 잘 맞을까요?</p>
        </div>

        <!-- 입력 영역 -->
        <div class="space-y-4 mb-8">
            <div class="relative">
                <input type="text" id="name1" placeholder="나의 이름" 
                    class="w-full bg-gray-50 text-gray-800 px-6 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white transition-all text-center text-lg font-medium placeholder:text-gray-300">
            </div>
            
            <div class="text-pink-300 text-2xl heart-pulse py-1">🤍</div>
            
            <div class="relative">
                <input type="text" id="name2" placeholder="상대방 이름" 
                    class="w-full bg-gray-50 text-gray-800 px-6 py-4 rounded-2xl outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white transition-all text-center text-lg font-medium placeholder:text-gray-300">
            </div>
        </div>

        <!-- 버튼 -->
        <button onclick="calculateLove()" 
            class="w-full bg-[#FF8FA3] hover:bg-[#FF7A92] text-white font-semibold text-lg py-4 rounded-2xl transition-colors shadow-sm mb-4">
            결과 확인하기
        </button>

        <!-- 결과 영역 (초기엔 숨김) -->
        <div id="resultArea" class="hidden mt-8 pt-6 border-t border-gray-50 fade-in">
            <p id="resultText" class="text-gray-600 mb-2 font-medium"></p>
            <div class="flex items-baseline justify-center gap-1">
                <span id="score" class="text-5xl font-extrabold text-[#FF8FA3]"></span>
                <span class="text-2xl font-bold text-[#FF8FA3]">%</span>
            </div>
            <p id="message" class="text-sm text-gray-400 mt-3"></p>
        </div>
    </div>

    <script>
        function calculateLove() {
            const name1 = document.getElementById('name1').value.trim();
            const name2 = document.getElementById('name2').value.trim();
            const resultArea = document.getElementById('resultArea');
            const resultText = document.getElementById('resultText');
            const scoreDisplay = document.getElementById('score');
            const message = document.getElementById('message');

            if (!name1 || !name2) {
                alert("두 사람의 이름을 모두 입력해주세요! ✨");
                return;
            }

            // 글자 코드를 활용한 간단한 궁합 알고리즘
            const combined = name1 + name2;
            let hash = 0;
            for (let i = 0; i < combined.length; i++) {
                hash += combined.charCodeAt(i);
            }
            
            // 50점에서 100점 사이의 점수가 나오도록 조정 (사랑스러운 분위기를 위해)
            const score = (hash % 51) + 50; 

            // 결과 화면 업데이트
            resultArea.classList.remove('hidden');
            resultText.innerHTML = `<span class="text-gray-800 font-bold">${name1}</span>님과 <span class="text-gray-800 font-bold">${name2}</span>님의 궁합은`;
            
            // 숫자 카운트업 애니메이션
            let current = 0;
            const timer = setInterval(() => {
                current += 2;
                if (current >= score) {
                    current = score;
                    clearInterval(timer);
                    
                    // 점수별 메시지
                    if(score >= 90) message.innerText = "천생연분 그 자체! 완벽한 짝꿍이에요 💘";
                    else if(score >= 70) message.innerText = "서로를 향한 마음이 예쁘게 커가는 중! 💕";
                    else message.innerText = "천천히 알아가면 더 좋은 인연이 될 거예요 ✨";
                }
                scoreDisplay.innerText = current;
            }, 20);
        }
    </script>
</body>
</html>
